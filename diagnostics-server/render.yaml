services:
  - type: web
    name: private-app-diagnostics
    runtime: node
    plan: starter
    rootDir: diagnostics-server
    buildCommand: node --test server.test.mjs
    startCommand: node server.mjs
    healthCheckPath: /health
    disk:
      name: diagnostic-reports
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: REPORT_DIR
        value: /var/data/reports
