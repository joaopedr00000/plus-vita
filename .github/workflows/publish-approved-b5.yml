name: Publish approved B5 beta

on:
  push:
    branches:
      - experimental/vitaplus-direct-b5
    paths:
      - '.github/workflows/publish-approved-b5.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish-b5:
    if: github.repository == 'joaopedr00000/plus-vita'
    runs-on: ubuntu-latest
    concurrency:
      group: vitaplus-publish-v006-b5
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN: '46096870352'
      BUILD_SHA: '7ce6d6e0ef4ed8d5dcae0a955939c38e183424af'
      TAG: v0.0.6-b5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify previously approved build and retrieve only B5
        run: |
          set -eu
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '.conclusion')" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '.head_sha')" = "$BUILD_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15243776983" --jq '.name')" = vitaplus-direct-v0.0.6-b5
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/15243776983" --jq '.expired')" = false
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name vitaplus-direct-v0.0.6-b5 --dir dist
          test -s dist/VitaPlus-v0.0.6-b5.vpk
          test -s dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import zipfile, struct
          with zipfile.ZipFile('dist/VitaPlus-v0.0.6-b5.vpk') as z:
              assert z.testzip() is None
              assert 'eboot.bin' in z.namelist()
              sfo = z.read('sce_sys/param.sfo')
              assert sfo[:4] == b'\0PSF'
              keys, data, count = struct.unpack_from('<III', sfo, 8)
              values = {}
              for i in range(count):
                  ko, fmt, length, cap, off = struct.unpack_from('<HHIII', sfo, 20+16*i)
                  key = sfo[keys+ko:sfo.index(b'\0',keys+ko)]
                  values[key] = sfo[data+off:data+off+length].rstrip(b'\0')
              assert values[b'TITLE_ID'] == b'PLVTB0001'
              assert values[b'APP_VER'] == b'00.32'
          PY
      - name: Publish only B5 as a prerelease
        run: |
          set -eu
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
            test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')" = "$BUILD_SHA"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$BUILD_SHA" --title "VitaPlus 0.0.6 B5 — Experimental Direct Updater" --notes-file release/v0.0.6-b5.md --draft --prerelease --latest=false
          fi
          gh release upload "$TAG" dist/VitaPlus-v0.0.6-b5.vpk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=true --latest=false
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,isDraft,assets
