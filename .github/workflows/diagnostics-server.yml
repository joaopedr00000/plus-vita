name: Private diagnostics server tests
on:
  push:
    branches: [infra/private-diagnostics]
    paths: ['diagnostics-server/**', '.github/workflows/diagnostics-server.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test diagnostics-server/server.test.mjs
