name: Vita smoke build

on:
  push:
    paths:
      - ".github/workflows/vita-smoke.yml"
      - ".gitmodules"
      - "external/pylux"
      - "external/freetype"
      - "vita-client/**"
      - "tools/build-vita-curl-mbedtls.sh"
      - "tools/test-app-workflow.sh"
      - "tools/test-app-controls.sh"
      - "tools/test-app-account-integration.sh"
      - "tools/test-app-text.sh"
      - "tools/test-app-font.sh"
      - "tools/test-app-catalogue.sh"
      - "tools/test-app-recovery.sh"
      - "tools/test-app-branding.sh"
      - "tools/test-deferred-log.sh"
      - "tools/test-app-covers.sh"
      - "tools/test-app-freetype.sh"
  pull_request:
    paths:
      - ".github/workflows/vita-smoke.yml"
      - ".gitmodules"
      - "external/pylux"
      - "external/freetype"
      - "vita-client/**"
      - "tools/test-app-workflow.sh"
      - "tools/test-app-controls.sh"
      - "tools/test-app-account-integration.sh"
      - "tools/test-app-text.sh"
      - "tools/test-app-font.sh"
      - "tools/test-app-catalogue.sh"
      - "tools/test-app-recovery.sh"
      - "tools/test-app-branding.sh"
      - "tools/test-deferred-log.sh"
      - "tools/test-app-covers.sh"
      - "tools/test-app-freetype.sh"
  workflow_dispatch:

jobs:
  app-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test experimental datacenter and bitrate helpers
        if: github.ref == 'refs/heads/beta1' || (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || github.ref == 'refs/heads/release/v0.0.2')))
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_cloud_experimental.c -o /tmp/plus-vita-cloud-test
          /tmp/plus-vita-cloud-test
      - name: Test offline browser to native encrypted QR interoperability
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || github.ref == 'refs/heads/release/v0.0.2')))
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev
          sh tools/test-qr-pairing.sh
      - name: Test adaptive streaming policy
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || github.ref == 'refs/heads/release/v0.0.2')))
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_adaptive_stream.c -o /tmp/pv-adaptive
          /tmp/pv-adaptive
          cc -std=c11 -Wall -Wextra -Werror -Ivita-client/src/platform vita-client/tests/video_reorder_test.c vita-client/src/platform/video_reorder.c -o /tmp/pv-reorder
          /tmp/pv-reorder
      - name: Test regional discovery policy
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || github.ref == 'refs/heads/release/v0.0.2')))
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_region_policy.c -o /tmp/pv-region
          /tmp/pv-region
      - name: Test embedded public CA bundle parsing
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || github.ref == 'refs/heads/release/v0.0.2')))
        run: |
          cmake -DPV_CA_INPUT="$PWD/vita-client/cacert.pem" -DPV_CA_OUTPUT=/tmp/pv-ca/pv_embedded_ca.h -P vita-client/cmake/embedded_ca.cmake
          cc -std=c11 -Wall -Wextra -Werror -I/tmp/pv-ca vita-client/tests/test_embedded_ca.c -lmbedx509 -lmbedcrypto -o /tmp/pv-ca-test
          /tmp/pv-ca-test
      - name: Test 19 locale tables
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || github.ref == 'refs/heads/release/v0.0.2')))
        run: |
          cc -std=c11 -O3 -Wall -Wextra -Werror -Wstring-compare vita-client/tests/test_i18n.c -o /tmp/pv-i18n
          /tmp/pv-i18n
      - name: Test VitaPlus dark gold renderer and QR theme
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -DPLUS_VITA_ADAPTIVE_STREAM=1 vita-client/tests/test_vitaplus_theme.c vita-client/src/app/render.c -o /tmp/pv-theme
          /tmp/pv-theme
      - name: Test local QR login HTTP validation
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || github.ref == 'refs/heads/release/v0.0.2')))
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_lan_login_http.c -o /tmp/pv-lan-login
          /tmp/pv-lan-login
      - name: Test reverse QR strict token validation
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || github.ref == 'refs/heads/release/v0.0.2')))
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_qr_reverse.c -o /tmp/pv-reverse
          /tmp/pv-reverse
      - name: Test native application workflow
        run: sh tools/test-app-workflow.sh
      - name: Test saved control layouts through Settings and gameplay input
        run: sh tools/test-app-controls.sh
      - name: Test app text output and bounds
        run: sh tools/test-app-text.sh
      - name: Test real font adapter and menu painting
        run: sh tools/test-app-font.sh
      - name: Test native account worker with simulated Sony responses
        run: sh tools/test-app-account-integration.sh
      - name: Test catalogue search and details
        run: sh tools/test-app-catalogue.sh
      - name: Test allocation cancellation and recovery
        run: sh tools/test-app-recovery.sh
      - name: Test startup splash and welcome branding
        run: sh tools/test-app-branding.sh
      - name: Test privacy schema and bounded deferred persistence
        run: sh tools/test-deferred-log.sh
      - name: Test audited H.264 headers and guarded slices
        run: sh tools/test-h264-config.sh
      - name: Test bounded asynchronous artwork and HTTP policy
        run: sh tools/test-app-covers.sh
      - name: Test real FreeType output and synthetic comparison journey
        run: sh tools/test-app-freetype.sh

  build:
    if: github.ref != 'refs/heads/beta1' && github.ref != 'refs/heads/beta3' && github.ref != 'refs/heads/release/v0.0.1' && github.ref != 'refs/heads/update/vitaplus-i18n' && github.ref != 'refs/heads/release/v0.0.2'
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    strategy:
      matrix:
        include:
          - diagnostic: "OFF"
            comparison: "OFF"
            release: "ON"
          - diagnostic: "ON"
            comparison: "OFF"
            release: "OFF"
          - diagnostic: "OFF"
            comparison: "ON"
            release: "OFF"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Allow Git reads of the mounted checkout
        # checkout's temporary HOME does not persist into container run steps.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify source and history before building
        if: matrix.release == 'ON'
        run: python3 tools/publication_gate.py

      - name: Configure
        run: >-
          cmake -S vita-client -B build/vita -DCMAKE_BUILD_TYPE=Release
          -DPLUS_VITA_DIAGNOSTIC_APP=${{ matrix.diagnostic }}
          -DPLUS_VITA_FONT_COMPARISON=${{ matrix.comparison }}
          -DPLUS_VITA_FONT_DEFAULT_FREETYPE=ON
          -DPLUS_VITA_RELEASE_CANDIDATE=${{ matrix.release }}

      - name: Build VPK
        run: cmake --build build/vita --parallel

      - name: Verify package
        run: test -s build/vita/plus_vita_smoke.vpk
      - name: Verify anonymous package and synthetic leak rejection
        if: matrix.release == 'ON'
        run: |
          python3 tools/publication_gate.py --vpk build/vita/plus_vita_smoke.vpk
          python3 tools/test-publication-gate.py build/vita/plus_vita_smoke.vpk
      # Publishing a downloadable VPK remains gated by the privacy audit in #22.

  beta3-build:
    env:
      PV_VERSION: ${{ github.ref == 'refs/heads/release/v0.0.2' && 'v0.0.2' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || github.ref == 'refs/heads/release/v0.0.2')) && 'v0.0.1' || 'beta3' }}
      PV_FILENAME: ${{ github.ref == 'refs/heads/release/v0.0.2' && 'VitaPlus-v0.0.2.vpk' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || github.ref == 'refs/heads/release/v0.0.2')) && 'plus-vita-v0.0.1.vpk' || 'plus-vita-v0.1.0-beta.3.vpk' }}
    if: github.repository == 'joaopedr00000/plus-vita' && (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || github.ref == 'refs/heads/release/v0.0.2')))
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      - name: Allow Git reads
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check source and history
        run: python3 tools/publication_gate.py --version "$PV_VERSION"
      - name: Build isolated Mbed TLS libcurl for Vita
        run: sh tools/build-vita-curl-mbedtls.sh "$PWD/build/curl-mbedtls"
      - name: Configure beta profile
        run: >-
          cmake -S vita-client -B build/beta3 -DCMAKE_BUILD_TYPE=Release
          -DPLUS_VITA_RELEASE_CANDIDATE=ON -DPLUS_VITA_RELEASE_VERSION=v002
          -DPLUS_VITA_PS5_EXPERIMENTAL=ON -DPLUS_VITA_BETA1=ON -DPLUS_VITA_BETA2=ON -DPLUS_VITA_BETA3=ON
          -DPLUS_VITA_CURL_ROOT="$PWD/build/curl-mbedtls"
          -DPLUS_VITA_FINAL_001=${{ (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || github.ref == 'refs/heads/release/v0.0.2')) && 'ON' || 'OFF' }}
          -DPLUS_VITA_FINAL_002=${{ github.ref == 'refs/heads/release/v0.0.2' && 'ON' || 'OFF' }}
      - name: Build and normalize VPK
        run: |
          cmake --build build/beta3 --parallel
          mkdir -p dist
          python3 - <<'PY'
          import os, zipfile
          with zipfile.ZipFile('build/beta3/plus_vita_smoke.vpk') as source, zipfile.ZipFile('dist/'+os.environ['PV_FILENAME'],'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as target:
              for name in sorted(source.namelist()):
                  info = zipfile.ZipInfo(name,date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.create_system=3
                  info.external_attr=0o100644<<16
                  target.writestr(info,source.read(name))
          PY
      - name: Verify beta package and leak fixtures
        run: |
          python3 tools/publication_gate.py --version "$PV_VERSION" --vpk "dist/$PV_FILENAME"
          python3 tools/test-publication-gate.py "dist/$PV_FILENAME" --version "$PV_VERSION"
          cd dist
          sha256sum "$PV_FILENAME" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: plus-vita-${{ env.PV_VERSION }}
          path: dist/
          if-no-files-found: error


  publish-v001:
    if: github.repository == 'joaopedr00000/plus-vita' && github.ref == 'refs/heads/release/v0.0.1' && github.event_name == 'push'
    needs: [app-workflow, beta3-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-plus-vita-v0.0.1
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: plus-vita-v0.0.1
          path: dist
      - name: Verify downloaded package checksum
        run: cd dist && sha256sum -c SHA256SUMS.txt
      - name: Publish final release from the validated commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/v0.0.1" --jq '.object.sha')
          if [ "$branch_sha" != "$GITHUB_SHA" ]; then
            echo "A newer release revision exists; skipping superseded commit."
            exit 0
          fi
          if gh release view v0.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Only the known in-flight initial release may be corrected. Do not
            # replace any unrelated release or move an unexpected tag.
            old_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.0.1" --jq '.object.sha')
            if [ "$old_sha" != "f16c17bd298507f72d066e94d68f444493a61c81" ]; then
              echo "Release already exists with an unexpected tag; refusing replacement"
              exit 1
            fi
            gh release edit v0.0.1 --repo "$GITHUB_REPOSITORY" --draft=true
            gh release upload v0.0.1 dist/plus-vita-v0.0.1.vpk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
            gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.0.1" -X PATCH -f sha="$GITHUB_SHA" -F force=true --jq '.object.sha' | grep -Fx "$GITHUB_SHA"
            gh release edit v0.0.1 --repo "$GITHUB_REPOSITORY" --title "Plus-Vita v0.0.1" --notes-file release/v0.0.1.md --draft=false --latest
          else
            gh release create v0.0.1 dist/plus-vita-v0.0.1.vpk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Plus-Vita v0.0.1" --notes-file release/v0.0.1.md --latest
          fi


  publish-v002:
    if: github.repository == 'joaopedr00000/plus-vita' && github.ref == 'refs/heads/release/v0.0.2' && github.event_name == 'push'
    needs: [app-workflow, beta3-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: vitaplus-draft-v002
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: plus-vita-v0.0.2
          path: dist
      - name: Verify release checksum and exact approved artwork
        run: |
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          expected = {
              'sce_sys/icon0.png': '8fa1a94ea26a0cceb87c55386916300a8678de746831bc7bac350e7934653899',
              'sce_sys/livearea/contents/bg.png': '3d1b8d9864297c020ec832c57d3ee4e1935335f075729cc131ff93d8f8bad029',
              'sce_sys/livearea/contents/startup.png': '355a2f3346f248aba4ad1c0a6f7996e8f440c493e9e7e6d8c1fee47dac21c107',
              'sce_sys/livearea/contents/template.xml': 'dc99eff7551a5cf7ead9fb9d1f2539756f329c0e794cd24851701627020a361c',
              'branding/splash.pvi': '32bce6c4b863268d036803b27f2b47bb70d7ee5b3541f209bea4ed55eb03e280',
              'branding/wordmark.pvi': '3f141884a46787ff669aa4fc3e15e1ef4596423fbd7f3a18f7bc0b34a665138a',
          }
          with zipfile.ZipFile('dist/VitaPlus-v0.0.2.vpk') as z:
              assert z.testzip() is None
              for name, digest in expected.items():
                  assert hashlib.sha256(z.read(name)).hexdigest() == digest, name
          PY
      - name: Publish validated VitaPlus visual update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/v0.0.2" --jq '.object.sha')
          if [ "$branch_sha" != "$GITHUB_SHA" ]; then
            echo "Newer release revision exists; skipping."
            exit 0
          fi
          if gh release view v0.0.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view v0.0.2 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "Existing published release left untouched."
              exit 1
            fi
            gh release edit v0.0.2 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VitaPlus v0.0.2 — Visual Update" --notes-file release/v0.0.2.md
          else
            gh release create v0.0.2 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VitaPlus v0.0.2 — Visual Update" --notes-file release/v0.0.2.md --draft
          fi
          # Never replace an already-existing tag pointing at other code.
          if tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.0.2" --jq '.object.sha' 2>/dev/null); then
            test "$tag_sha" = "$GITHUB_SHA"
          fi
          gh release upload v0.0.2 dist/VitaPlus-v0.0.2.vpk dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/v0.0.2" --jq '.object.sha')" = "$GITHUB_SHA"
          gh release edit v0.0.2 --repo "$GITHUB_REPOSITORY" --draft=false --latest
