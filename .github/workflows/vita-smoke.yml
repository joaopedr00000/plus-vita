name: Vita smoke build

on:
  push:
    # B4 is paused by the maintainer; build only on explicit manual dispatch.
    branches-ignore:
      - 'update/vitaplus-b4-internal'
    paths:
      - ".github/workflows/vita-smoke.yml"
      - ".gitmodules"
      - "external/pylux"
      - "external/freetype"
      - "vita-client/**"
      - "tools/build-vita-curl-mbedtls.sh"
      - "tools/test-app-workflow.sh"
      - "tools/test-app-controls.sh"
      - "tools/test-app-account-integration.sh"
      - "tools/test-app-text.sh"
      - "tools/test-app-font.sh"
      - "tools/test-app-catalogue.sh"
      - "tools/test-app-recovery.sh"
      - "tools/test-app-branding.sh"
      - "tools/test-deferred-log.sh"
      - "tools/test-app-covers.sh"
      - "tools/test-app-preview.sh"
      - "tools/test-audio-queue.sh"
      - "tools/publication_gate.py"
      - "tools/test-publication-gate.py"
      - "tools/test-update-package.py"
      - "release/v0.0.5.md"
      - "release/v0.0.5-2.md"
      - "release/v0.1.0.md"
      - "release/v0.0.6-b3.md"
      - "tools/test-app-freetype.sh"
  pull_request:
    paths:
      - ".github/workflows/vita-smoke.yml"
      - ".gitmodules"
      - "external/pylux"
      - "external/freetype"
      - "vita-client/**"
      - "tools/test-app-workflow.sh"
      - "tools/test-app-controls.sh"
      - "tools/test-app-account-integration.sh"
      - "tools/test-app-text.sh"
      - "tools/test-app-font.sh"
      - "tools/test-app-catalogue.sh"
      - "tools/test-app-recovery.sh"
      - "tools/test-app-branding.sh"
      - "tools/test-deferred-log.sh"
      - "tools/test-app-covers.sh"
      - "tools/test-app-preview.sh"
      - "tools/test-audio-queue.sh"
      - "tools/publication_gate.py"
      - "tools/test-publication-gate.py"
      - "tools/test-update-package.py"
      - "release/v0.0.5.md"
      - "release/v0.0.5-2.md"
      - "release/v0.1.0.md"
      - "release/v0.0.6-b3.md"
      - "tools/test-app-freetype.sh"
  workflow_dispatch:

jobs:
  app-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test experimental datacenter and bitrate helpers
        if: github.ref == 'refs/heads/beta1' || (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || (github.ref == 'refs/heads/release/v0.0.2' || (github.ref == 'refs/heads/update/vitaplus-about-controls' || (github.ref == 'refs/heads/release/v0.0.3' || (github.ref == 'refs/heads/update/vitaplus-game-search' || ((github.ref == 'refs/heads/release/v0.0.4' || (github.ref == 'refs/heads/release/v0.0.5' || (github.ref == 'refs/heads/release/v0.0.5-2' || (github.ref == 'refs/heads/update/vitaplus-clean' || github.ref == 'refs/heads/release/v0.0.6-b3')))) || github.ref == 'refs/heads/update/vitaplus-library'))))))))
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_cloud_experimental.c -o /tmp/plus-vita-cloud-test
          /tmp/plus-vita-cloud-test
      - name: Test offline browser to native encrypted QR interoperability
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || (github.ref == 'refs/heads/release/v0.0.2' || (github.ref == 'refs/heads/update/vitaplus-about-controls' || (github.ref == 'refs/heads/release/v0.0.3' || (github.ref == 'refs/heads/update/vitaplus-game-search' || ((github.ref == 'refs/heads/release/v0.0.4' || (github.ref == 'refs/heads/release/v0.0.5' || (github.ref == 'refs/heads/release/v0.0.5-2' || (github.ref == 'refs/heads/update/vitaplus-clean' || github.ref == 'refs/heads/release/v0.0.6-b3')))) || github.ref == 'refs/heads/update/vitaplus-library'))))))))
        run: |
          sudo apt-get update
          sudo apt-get install -y libmbedtls-dev
          sh tools/test-qr-pairing.sh
      - name: Test double and triple scanout ownership
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_present_slots.c -o /tmp/pv-present-slots
          /tmp/pv-present-slots
      - name: Test PS5 session client ID and package header bounds
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_beta_library_update.c -o /tmp/pv-beta-library-update
          /tmp/pv-beta-library-update
      - name: Test streaming option mask and preference parsing
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_stream_options.c -o /tmp/pv-stream-options
          /tmp/pv-stream-options
      - name: Test adaptive streaming policy
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || (github.ref == 'refs/heads/release/v0.0.2' || (github.ref == 'refs/heads/update/vitaplus-about-controls' || (github.ref == 'refs/heads/release/v0.0.3' || (github.ref == 'refs/heads/update/vitaplus-game-search' || ((github.ref == 'refs/heads/release/v0.0.4' || (github.ref == 'refs/heads/release/v0.0.5' || (github.ref == 'refs/heads/release/v0.0.5-2' || (github.ref == 'refs/heads/update/vitaplus-clean' || github.ref == 'refs/heads/release/v0.0.6-b3')))) || github.ref == 'refs/heads/update/vitaplus-library'))))))))
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_adaptive_stream.c -o /tmp/pv-adaptive
          /tmp/pv-adaptive
          cc -std=c11 -Wall -Wextra -Werror -Ivita-client/src/platform vita-client/tests/video_reorder_test.c vita-client/src/platform/video_reorder.c -o /tmp/pv-reorder
          /tmp/pv-reorder
      - name: Test strict helper handoff metadata
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_update_handoff.c -o /tmp/pv-handoff
          /tmp/pv-handoff
      - name: Test packed audio redundancy and sequence wrap
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_audio_repair.c -o /tmp/pv-audio-repair
          /tmp/pv-audio-repair
      - name: Test bounded audio queue and playback pacing
        if: ((github.ref == 'refs/heads/release/v0.0.4' || (github.ref == 'refs/heads/release/v0.0.5' || (github.ref == 'refs/heads/release/v0.0.5-2' || (github.ref == 'refs/heads/update/vitaplus-clean' || github.ref == 'refs/heads/release/v0.0.6-b3')))) || github.ref == 'refs/heads/update/vitaplus-library')
        run: sh tools/test-audio-queue.sh
      - name: Test regional discovery policy
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || (github.ref == 'refs/heads/release/v0.0.2' || (github.ref == 'refs/heads/update/vitaplus-about-controls' || (github.ref == 'refs/heads/release/v0.0.3' || (github.ref == 'refs/heads/update/vitaplus-game-search' || ((github.ref == 'refs/heads/release/v0.0.4' || (github.ref == 'refs/heads/release/v0.0.5' || (github.ref == 'refs/heads/release/v0.0.5-2' || (github.ref == 'refs/heads/update/vitaplus-clean' || github.ref == 'refs/heads/release/v0.0.6-b3')))) || github.ref == 'refs/heads/update/vitaplus-library'))))))))
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_region_policy.c -o /tmp/pv-region
          /tmp/pv-region
      - name: Test embedded public CA bundle parsing
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || (github.ref == 'refs/heads/release/v0.0.2' || (github.ref == 'refs/heads/update/vitaplus-about-controls' || (github.ref == 'refs/heads/release/v0.0.3' || (github.ref == 'refs/heads/update/vitaplus-game-search' || ((github.ref == 'refs/heads/release/v0.0.4' || (github.ref == 'refs/heads/release/v0.0.5' || (github.ref == 'refs/heads/release/v0.0.5-2' || (github.ref == 'refs/heads/update/vitaplus-clean' || github.ref == 'refs/heads/release/v0.0.6-b3')))) || github.ref == 'refs/heads/update/vitaplus-library'))))))))
        run: |
          cmake -DPV_CA_INPUT="$PWD/vita-client/cacert.pem" -DPV_CA_OUTPUT=/tmp/pv-ca/pv_embedded_ca.h -P vita-client/cmake/embedded_ca.cmake
          cc -std=c11 -Wall -Wextra -Werror -I/tmp/pv-ca vita-client/tests/test_embedded_ca.c -lmbedx509 -lmbedcrypto -o /tmp/pv-ca-test
          /tmp/pv-ca-test
      - name: Test 19 locale tables
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || (github.ref == 'refs/heads/release/v0.0.2' || (github.ref == 'refs/heads/update/vitaplus-about-controls' || (github.ref == 'refs/heads/release/v0.0.3' || (github.ref == 'refs/heads/update/vitaplus-game-search' || ((github.ref == 'refs/heads/release/v0.0.4' || (github.ref == 'refs/heads/release/v0.0.5' || (github.ref == 'refs/heads/release/v0.0.5-2' || (github.ref == 'refs/heads/update/vitaplus-clean' || github.ref == 'refs/heads/release/v0.0.6-b3')))) || github.ref == 'refs/heads/update/vitaplus-library'))))))))
        run: |
          cc -std=c11 -O3 -Wall -Wextra -Werror -Wstring-compare vita-client/tests/test_i18n.c -o /tmp/pv-i18n
          /tmp/pv-i18n
      - name: Test localized streaming settings
        run: |
          mkdir -p /tmp/pv-stream-test
          printf '#define JSON_C_HAVE_INTTYPES_H 1\n#define JSON_C_HAVE_STDINT_H 1\n' > /tmp/pv-stream-test/json_config.h
          cc -std=c11 -O3 -Wall -Wextra -Werror -Wstring-compare -DPLUS_VITA_ADAPTIVE_STREAM=1 -DPLUS_VITA_PS5_EXPERIMENTAL=1 -DPLUS_VITA_LAN_LOGIN=1 -Ivita-client/src/app -Iexternal/json-c -I/tmp/pv-stream-test vita-client/src/app/app.c vita-client/src/platform/control_layout.c vita-client/src/app/utf8.c vita-client/src/platform/credential.c vita-client/tests/test_stream_settings.c -l:libjson-c.so.5 -o /tmp/pv-stream-test/test
          /tmp/pv-stream-test/test
      - name: Test PS5 discovery and manual selection recovery
        run: |
          cc -std=c11 -O1 -Wall -Wextra -Werror -DPLUS_VITA_ADAPTIVE_STREAM=1 -DPLUS_VITA_PS5_EXPERIMENTAL=1 -DPLUS_VITA_LAN_LOGIN=1 -Ivita-client/src/app -Iexternal/json-c -I/tmp/pv-stream-test vita-client/src/app/app.c vita-client/src/platform/control_layout.c vita-client/src/app/utf8.c vita-client/src/platform/credential.c vita-client/tests/test_ps5_discovery.c -l:libjson-c.so.5 -o /tmp/pv-stream-test/ps5
          /tmp/pv-stream-test/ps5
      - name: Test authenticated local token vault
        run: |
          sudo apt-get install -y libmbedtls-dev
          mkdir -p /tmp/pv-vault-test
          printf '#define JSON_C_HAVE_INTTYPES_H 1\n#define JSON_C_HAVE_STDINT_H 1\n' > /tmp/pv-vault-test/json_config.h
          cc -std=c11 -O2 -Wall -Wextra -Werror vita-client/tests/test_account_vault.c -lmbedcrypto -o /tmp/pv-vault-test/vault
          /tmp/pv-vault-test/vault
          cc -D_POSIX_C_SOURCE=200809L -std=c11 -O2 -Wall -Wextra -Werror -pthread -DPLUS_VITA_ACCOUNT_VAULT=1 -DPLUS_VITA_LAN_LOGIN=1 -Iexternal/pylux/lib/include -Iexternal/pylux/third-party/curl/include -Iexternal/json-c -I/tmp/pv-vault-test vita-client/src/app/account_vita.c vita-client/src/platform/credential.c vita-client/src/platform/random.c vita-client/tests/test_vault_storage.c -lmbedcrypto -l:libjson-c.so.5 -o /tmp/pv-vault-test/storage
          (dir=$(mktemp -d); cd "$dir"; /tmp/pv-vault-test/storage)
          cc -std=c11 -O1 -Wall -Wextra -Werror -DPLUS_VITA_ACCOUNT_VAULT=1 -DPLUS_VITA_ADAPTIVE_STREAM=1 -DPLUS_VITA_PS5_EXPERIMENTAL=1 -DPLUS_VITA_LAN_LOGIN=1 -Ivita-client/src/app -Iexternal/json-c -I/tmp/pv-vault-test vita-client/src/app/app.c vita-client/src/platform/control_layout.c vita-client/src/app/utf8.c vita-client/src/platform/credential.c vita-client/tests/test_vault_menu.c -l:libjson-c.so.5 -o /tmp/pv-vault-test/menu
          /tmp/pv-vault-test/menu
      - name: Test cloud response interoperability and privacy
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iexternal/json-c -I/tmp/pv-stream-test vita-client/tests/test_cloud_response.c -l:libjson-c.so.5 -o /tmp/pv-stream-test/response
          /tmp/pv-stream-test/response
      - name: Test update channel ordering and archive policy
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_update_policy.c -o /tmp/pv-update-policy
          /tmp/pv-update-policy
          cc -std=c11 -Wall -Wextra -Werror vita-client/src/platform/update_package.c vita-client/tests/test_update_package.c -lz -o /tmp/pv-update-package
          python3 tools/test-update-package.py /tmp/pv-update-package
      - name: Test storage migration and restricted vault-key migration
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/src/platform/storage_migration.c vita-client/tests/test_storage_migration.c -o /tmp/pv-storage-test
          /tmp/pv-storage-test
      - name: Test VitaPlus dark gold renderer and QR theme
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -DPLUS_VITA_ADAPTIVE_STREAM=1 vita-client/tests/test_vitaplus_theme.c vita-client/src/app/render.c -o /tmp/pv-theme
          /tmp/pv-theme
      - name: Test local QR login HTTP validation
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || (github.ref == 'refs/heads/release/v0.0.2' || (github.ref == 'refs/heads/update/vitaplus-about-controls' || (github.ref == 'refs/heads/release/v0.0.3' || (github.ref == 'refs/heads/update/vitaplus-game-search' || ((github.ref == 'refs/heads/release/v0.0.4' || (github.ref == 'refs/heads/release/v0.0.5' || (github.ref == 'refs/heads/release/v0.0.5-2' || (github.ref == 'refs/heads/update/vitaplus-clean' || github.ref == 'refs/heads/release/v0.0.6-b3')))) || github.ref == 'refs/heads/update/vitaplus-library'))))))))
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_lan_login_http.c -o /tmp/pv-lan-login
          /tmp/pv-lan-login
      - name: Test reverse QR strict token validation
        if: (github.ref == 'refs/heads/beta3' || (github.ref == 'refs/heads/release/v0.0.1' || (github.ref == 'refs/heads/update/vitaplus-i18n' || (github.ref == 'refs/heads/release/v0.0.2' || (github.ref == 'refs/heads/update/vitaplus-about-controls' || (github.ref == 'refs/heads/release/v0.0.3' || (github.ref == 'refs/heads/update/vitaplus-game-search' || ((github.ref == 'refs/heads/release/v0.0.4' || (github.ref == 'refs/heads/release/v0.0.5' || (github.ref == 'refs/heads/release/v0.0.5-2' || (github.ref == 'refs/heads/update/vitaplus-clean' || github.ref == 'refs/heads/release/v0.0.6-b3')))) || github.ref == 'refs/heads/update/vitaplus-library'))))))))
        run: |
          cc -std=c11 -Wall -Wextra -Werror vita-client/tests/test_qr_reverse.c -o /tmp/pv-reverse
          /tmp/pv-reverse
      - name: Test native application workflow
        run: sh tools/test-app-workflow.sh
      - name: Test saved control layouts through Settings and gameplay input
        run: sh tools/test-app-controls.sh
      - name: Test app text output and bounds
        run: sh tools/test-app-text.sh
      - name: Test real font adapter and menu painting
        run: sh tools/test-app-font.sh
      - name: Test native account worker with simulated Sony responses
        run: sh tools/test-app-account-integration.sh
      - name: Test catalogue search and details
        run: sh tools/test-app-catalogue.sh
      - name: Test focused artwork preview in legacy and adaptive catalogues
        if: github.ref == 'refs/heads/update/vitaplus-library' || (github.ref == 'refs/heads/release/v0.0.5' || (github.ref == 'refs/heads/release/v0.0.5-2' || (github.ref == 'refs/heads/update/vitaplus-clean' || github.ref == 'refs/heads/release/v0.0.6-b3')))
        run: sh tools/test-app-preview.sh
      - name: Test allocation cancellation and recovery
        run: sh tools/test-app-recovery.sh
      - name: Test startup splash and welcome branding
        run: sh tools/test-app-branding.sh
      - name: Test privacy schema and bounded deferred persistence
        run: sh tools/test-deferred-log.sh
      - name: Test audited H.264 headers and guarded slices
        run: sh tools/test-h264-config.sh
      - name: Test bounded asynchronous artwork and HTTP policy
        run: sh tools/test-app-covers.sh
      - name: Test real FreeType output and synthetic comparison journey
        run: sh tools/test-app-freetype.sh

  build:
    if: github.ref != 'refs/heads/beta1' && github.ref != 'refs/heads/beta3' && github.ref != 'refs/heads/release/v0.0.1' && github.ref != 'refs/heads/update/vitaplus-i18n' && github.ref != 'refs/heads/release/v0.0.2' && github.ref != 'refs/heads/update/vitaplus-about-controls' && github.ref != 'refs/heads/release/v0.0.3' && github.ref != 'refs/heads/update/vitaplus-game-search' && github.ref != 'refs/heads/release/v0.0.4' && github.ref != 'refs/heads/release/v0.0.5' && github.ref != 'refs/heads/release/v0.0.5-2' && github.ref != 'refs/heads/update/vitaplus-clean' && github.ref != 'refs/heads/release/v0.0.6-b3' && github.ref != 'refs/heads/update/vitaplus-library'
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    strategy:
      matrix:
        include:
          - diagnostic: "OFF"
            comparison: "OFF"
            release: "ON"
          - diagnostic: "ON"
            comparison: "OFF"
            release: "OFF"
          - diagnostic: "OFF"
            comparison: "ON"
            release: "OFF"
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Allow Git reads of the mounted checkout
        # checkout's temporary HOME does not persist into container run steps.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Verify source and history before building
        if: matrix.release == 'ON'
        run: python3 tools/publication_gate.py

      - name: Configure
        run: >-
          cmake -S vita-client -B build/vita -DCMAKE_BUILD_TYPE=Release
          -DPLUS_VITA_DIAGNOSTIC_APP=${{ matrix.diagnostic }}
          -DPLUS_VITA_FONT_COMPARISON=${{ matrix.comparison }}
          -DPLUS_VITA_FONT_DEFAULT_FREETYPE=ON
          -DPLUS_VITA_RELEASE_CANDIDATE=${{ matrix.release }}

      - name: Build VPK
        run: cmake --build build/vita --parallel

      - name: Verify package
        run: test -s build/vita/plus_vita_smoke.vpk
      - name: Verify anonymous package and synthetic leak rejection
        if: matrix.release == 'ON'
        run: |
          python3 tools/publication_gate.py --vpk build/vita/plus_vita_smoke.vpk
          python3 tools/test-publication-gate.py build/vita/plus_vita_smoke.vpk
      # Publishing a downloadable VPK remains gated by the privacy audit in #22.

  beta3-build:
    env:
